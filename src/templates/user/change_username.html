{% extends "base.html" %}

{% block main_content %}
<form action="" method="POST" novalidate>
    {{ form.hidden_tag() }}

    {{ form.new_user_id.label}}
    {{ form.new_user_id() }}
    {% for error in form.new_user_id.errors %}
        {{ error }}
    {% endfor %}
    <br />
    {{ form.submit() }}
</form>
{{ message }}
<p><a href="{{ url_for('user')}}">Return to Account</a></p>
{% endblock %}
