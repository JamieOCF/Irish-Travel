{% extends "booking_base.html" %}

{% block booking %}
<h2>Confirmation</h2>
<form action="" method="POST" novalidate>
    {{ form.hidden_tag() }}

    {{ form.confirm.label}}
    {{ form.confirm() }}
    {% for error in form.confirm.errors %}
        {{ error }}
    {% endfor %}
    <br />
    {{ form.submit() }}
</form>
{% endblock %}
