{% extends "base.html" %}

{% block main_content %}
<table>
    <tr>
        <th>City ID</th>
        <th>City</th>
        <th>Country</th>
        <th>Image Link</th>
        <th>Prices</th>
        <th>Availability</th>
    </tr>
    {% for city in destinations %}
    <tr>
        <td>{{ city["city_id"] }} </td>
        <td>{{ city["city_name"] }} </td>
        <td>{{ city["country"] }} </td>
        <td>{{ city["image_link"] }}</td>
        <td><a href="{{url_for('remove_destination', city_id=city['city_id'])}}"><img src="{{ url_for('static', filename='bin.png') }}" alt="Remove city" title="Remove city {{city['city_id']}}"></a></td>
    </tr>
    {% endfor %}
</table>
<p><a href="{{ url_for('add_destination')}}">Add city</a></p>
{% endblock %}
